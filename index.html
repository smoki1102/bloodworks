<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#131512" />
    <title>BloodWorks: Stick Factory</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div id="brand">BLOOD<span>WORKS</span></div>
        <div id="hud">
          <div id="resRow">
            <div class="res" data-tip="Geld – für Bau, Reinigung und Verkauf">
              € <b id="rMoney">0</b>
            </div>
            <div class="res blood" data-tip="Blut – Skill- und Upgrade-Währung">
              Blut <b id="rBlood">0</b><small id="rBloodCap"></small>
            </div>
            <div class="res" id="rEnergyBox" data-tip="Energie –Maschinen laufen nur mit Strom">
              <span id="rEnergyIcon"></span> <b id="rEnergy">0</b>
            </div>
            <div
              class="res"
              data-tip="Teile – abgetrennte Körperteile, Währung für Maschinen- und Logistik-Skills"
            >
              Teile <b id="rParts">0</b>
            </div>
            <div class="res" data-tip="Asche – Rückstand aus dem Verbrenner">
              Asche <b id="rAsh">0</b>
            </div>
            <div class="res" data-tip="Leichen – auf Bändern, in Maschinen und auf dem Boden">
              Leichen <b id="rCorpse">0</b>
            </div>
          </div>
          <p id="stats"></p>
        </div>
        <div id="acts">
          <div class="seg" id="speed">
            <button data-s="1" class="on">1×</button
            ><button data-s="2">2×</button><button data-s="4">4×</button>
          </div>
          <button id="btnPlay" data-tip="Simulation starten (Leertaste)">Start</button>
          <button
            id="btnResearch"
            data-a="openForschung"
            data-tip="Skill-Netz und Upgrades (K)"
          >
            Forschung
          </button>
          <button id="btnStats" data-a="openStats" data-tip="Statistik (I)">Statistik</button>
          <button id="btnSave" data-tip="Spielstand speichern">Speichern</button>
          <button id="btnLoad" data-tip="Spielstand laden">Laden</button>
          <button id="btnSkipTut" hidden data-tip="Tutorial überspringen">
            Überspringen
          </button>
          <button id="btnNew" data-tip="Neues Spiel – kehrt zum Startmenü zurück">
            Neu
          </button>
          <button id="btnSettings" data-tip="Einstellungen" aria-label="Einstellungen">
            <span data-icon="settings"></span>
          </button>
        </div>
      </header>
      <main id="view">
        <canvas id="cv"></canvas>
        <div id="hint"></div>
        <div id="quest"></div>
        <div id="forschung" class="hide">
          <div class="resHead">
            <b class="ftitle">FORSCHUNG</b>
            <span class="fcur">Blut <b id="fBlood">0</b> · Teile <b id="fParts">0</b></span>
            <span class="ftabs">
              <button data-ftab="net" class="on">Skill-Netz</button>
              <button data-ftab="upg">Upgrades</button>
            </span>
            <button
              class="close"
              data-a="closeForschung"
              data-icon="close"
              data-tip="Schließen (Esc)"
              aria-label="Schließen"
            ></button>
          </div>
          <div id="fNet" class="fpane"></div>
          <div id="fUpg" class="fpane hide"></div>
        </div>
        <div id="statsPanel" class="hide">
          <div class="resHead">
            <b class="ftitle">STATISTIK</b>
            <span class="fcur">Spielzeit <b id="stTime">0:00</b></span>
            <button
              class="close"
              data-a="closeStats"
              data-icon="close"
              data-tip="Schließen (Esc)"
              aria-label="Schließen"
            ></button>
          </div>
          <div id="statPane" class="statGrid"></div>
        </div>
        <div id="inspector"></div>
        <div id="toasts"></div>
      </main>
      <aside id="side">
        <div id="tabs"></div>
        <div id="list"></div>
      </aside>
    </div>
    <div id="setPop" class="hide" role="dialog" aria-label="Einstellungen">
      <div class="lbl">Gore-Level</div>
      <div class="segs" id="goreSegGame">
        <button data-g="0">Öl</button><button data-g="50">Mittel</button
        ><button data-g="100" class="on">Cartoon</button>
      </div>
      <label class="setRow"
        ><input type="checkbox" id="optMotion" />
        Bewegung reduzieren</label
      >
    </div>
    <div id="modal">
      <div class="box">
        <h1>BLOOD<span>WORKS</span></h1>
        <p class="sub">Stick Factory</p>
        <p class="warn">
          Abstrakte Cartoon-Darstellung von Strichmännchen und Maschinen. Keine
          realistische Gewalt. Alle Abläufe sind rein mechanisch.
        </p>
        <div class="lbl">Gore-Level</div>
        <div class="segs" id="goreSeg">
          <button data-g="0">Öl</button><button data-g="50">Mittel</button
          ><button data-g="100" class="on">Cartoon</button>
        </div>
        <button class="big" id="btnStart">Tutorial starten</button>
        <button class="big alt" id="btnFree">Freier Start</button>
        <button class="big alt" id="btnContinue" hidden>
          Spielstand laden
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
